<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#164dff"><title>화장실 후기 · 바로화장실</title><meta name="description" content="서울 개방화장실 이용 후기를 확인하고 공유하세요."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23164dff'/%3E%3Ctext x='20' y='27' text-anchor='middle' font-family='Arial' font-weight='bold' font-size='20' fill='white'%3EWC%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="community.css"><script type="module" src="community.js"></script></head><body class="community-page"><header><a class="brand" href="./"><span class="brand-icon">WC</span>바로화장실</a><nav class="site-actions" aria-label="주요 메뉴"><a class="nav-link" href="./">지도</a><button id="auth-button" class="auth-button" type="button">로그인</button></nav></header><main class="community-main"><section class="community-hero"><span class="eyebrow">함께 만드는 이용 정보</span><h1>화장실 후기</h1><p>청결 상태, 접근성, 실제 운영 여부를 공유해 주세요.</p><button id="write-button" class="primary write-button" type="button">후기 작성하기</button></section><section class="board" aria-labelledby="board-title"><div class="board-tools"><div><h2 id="board-title">최근 후기</h2><span id="review-count">불러오는 중</span></div><label class="search-label"><span class="sr-only">후기 검색</span><input id="review-search" type="search" placeholder="화장실 이름이나 내용 검색"></label></div><div id="board-status" role="status" aria-live="polite"></div><div id="review-list" class="review-list"></div></section></main><dialog id="review-dialog" class="review-dialog"><form id="review-form" class="review-form"><button id="review-close" class="auth-close" type="button" aria-label="닫기">×</button><span class="eyebrow">이용 경험 공유</span><h2 id="review-form-title">후기 작성</h2><input id="review-id" type="hidden"><label>화장실<input id="toilet-input" list="toilet-options" maxlength="120" placeholder="화장실 이름을 입력하세요" required><datalist id="toilet-options"></datalist></label><label>제목<input id="review-title" maxlength="80" required placeholder="한 줄로 알려주세요"></label><label>별점<select id="review-rating" required><option value="5">★★★★★ 5점</option><option value="4">★★★★☆ 4점</option><option value="3">★★★☆☆ 3점</option><option value="2">★★☆☆☆ 2점</option><option value="1">★☆☆☆☆ 1점</option></select></label><label>내용<textarea id="review-content" maxlength="1000" rows="6" required placeholder="청결 상태, 접근성, 운영 여부 등을 알려주세요."></textarea></label><p id="review-form-message" class="auth-message" role="status"></p><button class="primary" type="submit">저장하기</button></form></dialog><footer class="community-footer">후기는 작성자의 경험이며 시설의 현재 상태와 다를 수 있습니다.</footer></body></html>
